[package]
name = "maolan-llama"
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Llama 3 large language model with Burn, vendored from tracel-ai/models for maolan-generate"
repository = "https://github.com/maolan/llama-burn"
homepage = "https://maolan.rs"
readme = "README.md"
authors = ["Maolan Team"]
keywords = ["llama", "burn", "inference", "ml"]
categories = ["science", "algorithms"]
publish = true

[features]
default = ["pretrained"]
pretrained = ["burn/network", "dep:dirs"]

llama3 = ["dep:tiktoken-rs", "dep:rustc-hash", "dep:base64"]
tiny = ["dep:tokenizers"]

# Import pytorch/safetensors weights
import = ["burn-store/pytorch", "burn-store/safetensors"]

[dependencies]
# Runtime devices support GPU inference via `wgpu` and CPU inference/tests
# via `Device::flex()`.
burn = { version = "0.22.0", default-features = false, features = ["std", "wgpu", "flex"] }
burn-store = { version = "0.22.0", default-features = false, features = ["std"] }
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
dirs = { version = "6", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
rand = { version = "0.10", default-features = false, features = ["alloc", "std_rng"] }

# Tiktoken tokenizer (llama 3)
tiktoken-rs = { version = "0.12", optional = true }
base64 = { version = "0.23", optional = true }
rustc-hash = { version = "2.1", optional = true }

# SentencePiece tokenizer (tiny llama / llama 2)
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
